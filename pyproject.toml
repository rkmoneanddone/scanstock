[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scanstock"
version = "0.1.0"
description = "Local-first, configurable NSE stock condition scanner"
requires-python = ">=3.12"
dependencies = [
  "dhanhq>=2.0.2,<3",
  "fastapi>=0.116,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
scanstock = "scanstock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
