[app]
timezone = "Asia/Kolkata"
database_url = "sqlite:///data/scanstock.db"

[market_data]
provider = "dhan"
exchange_segment = "NSE_EQ"
instrument_type = "EQUITY"
timeframe = "1D"
initial_from_date = "1990-01-01"
request_delay_seconds = 3.0
max_retries = 7

[universe]
name = "nse_all"
symbols = ["*"]
